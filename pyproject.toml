[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pii-redaction-demo"
version = "0.1.0"
description = "Proof of concept: end-to-end PII redaction flow on Azure AI services"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Vinod Patil" }]
requires-python = ">=3.11"
dependencies = [
    "azure-ai-textanalytics>=5.3,<6.0",
    "azure-ai-vision-imageanalysis>=1.0,<2.0",
    "azure-identity>=1.17,<2.0",
    "pillow>=10.4,<12.0",
    "pydantic-settings>=2.0,<3.0",
]

[project.scripts]
pii-redaction-demo = "pii_redaction_demo.main:main"

[project.optional-dependencies]
dev = [
    "mypy>=1.10,<2.0",
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<6.0",
    "ruff>=0.6,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pii_redaction_demo"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: tests that cross process or service boundaries",
    "e2e: end-to-end tests against a deployed environment",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["pii_redaction_demo"]
mypy_path = "src"

[tool.coverage.run]
branch = true
source = ["pii_redaction_demo"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80